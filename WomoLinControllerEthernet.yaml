esphome:
  # https://womolin.de/products/womolin-lin-controller/
  name: "womo_lin_controller"

external_components:
  - source: github://Fabian-Schmidt/esphome-truma_inetbox
  # - source:
  #     type: local
  #     path: ./components
    components: ["truma_inetbox"]

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 2000000
  # level: VERY_VERBOSE
  # level: VERBOSE
  # level: DEBUG
  # level: INFO
  # level: WARN
  level: NONE

ethernet:
  type: KSZ8081RNA
  mdc_pin: 23
  mdio_pin: 18
  clk_mode: GPIO16_OUT

uart:
  - id: lin_uart_bus
    tx_pin: 15
    rx_pin: 14
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 2

truma_inetbox:
  id: truma_inetbox_id
  uart_id: lin_uart_bus
